[project]
name = "geminka-agent"
version = "0.1.0"
description = "Autonomous AI Companion & Assistant on Google Antigravity & Gemini 3.7 with live SSE streaming, emotional intelligence, and rich Telegram markup."
readme = "README.md"
authors = [
    { name = "SkrudjReal", email = "batyabosszrostik@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.20.0,<4.0.0",
    "aiofiles>=24.1.0",
    "aiohttp>=3.10.0",
    "httpx>=0.28.0",
    "pillow>=10.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
