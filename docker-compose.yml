services:
  geminka-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geminka-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./PERSONA.md:/app/PERSONA.md:ro
