services:
  geminka-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geminka-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./memories:/app/memories
      - ./memory:/app/memory
      - ./memory/model-cache:/home/geminka/.cache
      - ./system_prompt.md:/app/system_prompt.md
